<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/festiva-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Festiva AI — Big moments. Beautifully planned.</title>
    <meta name="description" content="Festiva AI is your AI-powered event planning assistant. Generate complete plans for weddings, birthdays, corporate events, and more — in under a minute." />
    <meta name="keywords" content="event planning, AI event planner, wedding planner, birthday planner, corporate events, Festiva AI" />
    <meta property="og:title" content="Festiva AI — Big moments. Beautifully planned." />
    <meta property="og:description" content="AI-powered event planning for every celebration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Festiva AI" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('festiva_theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
